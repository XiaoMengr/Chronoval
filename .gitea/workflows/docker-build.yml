# Chronoval Docker 镜像构建工作流（Gitea Actions）
#
# ▍零第三方 Action 设计（重要）
#   本仓库 Runner 处于私有/受限网络，无法访问 github.com —— 所有基于 GitHub 的
#   第三方 action（actions/checkout、docker/login-action、build-push-action、setup-buildx 等）
#   在拉取 action 本体时都会超时失败（read tcp ...:443 connection timed out）。
#   因此本工作流【完全不用任何 uses: 第三方 action】，改用纯 shell 命令：
#     · 取源码   -> git clone（内网 172.16.0.1:322，带凭据）
#     · 构建     -> docker buildx / docker build + docker push（内网 Container 注册表）
#     · 离线资源 -> Gitea 内网 API 创建/上传 Release 附件（版本下载）
#
# ▍内网地址
#   统一走内网 `http://172.16.0.1:322`（Container 注册表 / API / clone / Release 上传）。
#
# ▍前置要求
#   - Gitea 已启用 Actions 与 Container 注册表
#   - Runner 可访问内网 172.16.0.1:322
#   - 仓库已配置 Secret：CI_TOKEN（Gitea 用户 PAT，含 write:package 与 write contents）。
#     该 PAT 同时用于 内网 git clone、registry 登录、创建/上传 Release 附件。
#
# ▍可选 Secrets
#   GITEA_SERVER_URL -> 默认 http://172.16.0.1:322
#   GITEA_OWNER      -> 镜像/Release 归属（默认取仓库 owner）

name: docker-build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
  workflow_dispatch:

env:
  # 统一走内网地址
  GITEA_SERVER_URL: ${{ secrets.GITEA_SERVER_URL || 'http://172.16.0.1:322' }}
  IMAGE_NAME: chronoval
  # 仓库鉴权 PAT（内网 clone / registry / API / Release 全用它）
  CI_TOKEN: ${{ secrets.CI_TOKEN }}

jobs:
  offline-assets:
    # 生成/更新离线资源，并作为 Release 附件上传（版本下载），供后续构建离线使用
    runs-on: ubuntu-latest
    env:
      GITEA_API: ${{ secrets.GITEA_SERVER_URL || 'http://172.16.0.1:322' }}/api/v1
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      REL_TAG: build-offline-assets
    steps:
      - name: Clone source from internal Gitea
        run: |
          set -e
          REPO_ID="${OWNER}/${REPO}"
          # 复用 GITHUB_REPOSITORY（owner/repo，act_runner 会注入）；为空则用 OWNER/REPO
          THE_REPO="${GITHUB_REPOSITORY:-${OWNER}/${REPO}}"
          mkdir -p src
          git clone --depth 1 "http://${OWNER}:${CI_TOKEN}@172.16.0.1:322/${THE_REPO}.git" src

      - name: Package source snapshot for offline fallback
        run: |
          set -e
          mkdir -p /workdir
          tar --exclude=node_modules --exclude=.output --exclude=.nuxt -czf /workdir/src.tar.gz -C src .

      - name: Ensure offline-assets Release exists
        run: |
          set -e
          AUTH="Authorization: token ${CI_TOKEN}"
          RELEASE_JSON=$(curl -sf -H "$AUTH" \
            "${GITEA_API}/repos/${OWNER}/${REPO}/releases/tags/${REL_TAG}" 2>/dev/null || \
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${REL_TAG}\",\"name\":\"Chronoval 离线构建资源\",\"body\":\"用于离线构建的依赖包与源码快照（内网自动生成）\"}" \
              "${GITEA_API}/repos/${OWNER}/${REPO}/releases" || echo '{}')
          # 写入纯 JSON（后续步骤直接 json.parse）
          printf '%s\n' "$RELEASE_JSON" > /workdir/release.json
          echo "release_json=$RELEASE_JSON"

      - name: Upload source snapshot as release attachment
        run: |
          set -e
          AUTH="Authorization: token ${CI_TOKEN}"
          RELEASE_ID=$(python3 -c "import json,sys; d=json.load(open('/workdir/release.json')); print(d.get('id',''))" 2>/dev/null || echo '')
          echo "release_id=$RELEASE_ID"
          if [ -n "$RELEASE_ID" ] && [ -f /workdir/src.tar.gz ]; then
            curl -sS -X POST -H "$AUTH" \
              -F "attachment=@/workdir/src.tar.gz" \
              "${GITEA_API}/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/assets" \
              || echo "upload-src-warn"
          fi

  docker:
    needs: offline-assets
    runs-on: ubuntu-latest
    env:
      # 内网 Container 注册表地址（去 scheme）
      REG: ${{ secrets.GITEA_SERVER_URL || 'http://172.16.0.1:322' }}
      OWNER: ${{ github.repository_owner }}
      REG_H: ${{ secrets.GITEA_SERVER_URL || 'http://172.16.0.1:322' }}
    steps:
      - name: Clone source from internal Gitea
        run: |
          # 仓库地址缺省用当前仓库
          REPO_ID="${OWNER}/${IMAGE_NAME}"
          # 从内置上下文取得仓库名；若为空则用 IMAGE_NAME 兜底
          THE_REPO="${GITHUB_REPOSITORY:-${OWNER}/${IMAGE_NAME}}"
          echo "cloning ${THE_REPO}"
          git clone --depth 1 "http://${OWNER}:${CI_TOKEN}@172.16.0.1:322/${THE_REPO}.git" . 2>/dev/null \
            || git --config http.sslVerify=false clone "http://${OWNER}:${CI_TOKEN}@172.16.0.1:322/${THE_REPO}.git" .
          ls -la

      - name: Compute image tag
        id: meta
        run: |
          SRV="${REG_H#*://}"          # 去掉 http(s)://
          SRV="${SRV%%/*}"
          # Docker 注册表仓库名必须全小写（Gitea 对 owner 大小写不敏感，路径用小写即可）
          OWNER_L="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG_REF="latest"
          else
            TAG_REF="${GITHUB_REF##*/}"
            # 发布稳定版本：git tag 用 v1.0.0.2，镜像 tag 用裸版本 1.0.0.2
            TAG_REF="${TAG_REF#v}"
          fi
          TAGS="${SRV}/${OWNER_L}/chronoval:${TAG_REF}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Built tag: ${TAGS}"

      - name: Log in to Gitea Container Registry (internal)
        run: |
          SRV="${REG_H#*://}"; SRV="${SRV%%/*}"
          echo "${CI_TOKEN}" | docker login "$SRV" --username "${OWNER}" --password-stdin 2>&1 || \
            echo "${CI_TOKEN}" | docker login "http://${SRV}" --username "${OWNER}" --password-stdin

      - name: Set up QEMU (native only, fallback no-op)
        run: |
          echo "native build on linux/amd64"
          docker version || true
          docker buildx version || true

      - name: Build and push Docker image
        # 优先使用经典 docker build + docker push：
        #  · buildx docker-container driver 启动的 buildkit 容器会继承 Runner 的
        #    HTTP(S)_PROXY（指向宿主 192.168.43.1:2080），在 buildkit 内该代理不可达，
        #    导致取 /v2/token 时报 "proxyconnect ... i/o timeout"。
        #  · 而 daemon（docker build/push）走宿主网络，已 docker login 且注册表标记 insecure，
        #    直连即可推送成功。Dockerfile 的 buildkit cache mount 在 docker 28 的默认
        #    BuildKit 后端同样支持，不影响。
        run: |
          set -e
          TAGS="${{ steps.meta.outputs.tags }}"
          echo "== Classic docker build + docker push =="
          DOCKER_BUILDKIT=1 docker build -t "${TAGS}" . 2>&1
          docker push "${TAGS}"
          echo "PUSH OK: ${TAGS}"

  echo-usage:
    needs: [docker]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Show pull usage
        run: |
          SRV="${GITEA_SERVER_URL#*://}"; SRV="${SRV%%/*}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            IMG_TAG="latest"
          else
            IMG_TAG="${GITHUB_REF##*/}"; IMG_TAG="${IMG_TAG#v}"
          fi
          echo "构建完成（最终以 docker job 结论为准）。"
          echo "镜像地址：${SRV}/${OWNER}/chronoval:${IMG_TAG}"
          echo "拉取（若注册表为 http 需配置 insecure-registry）："
          echo "  docker pull ${SRV}/${OWNER}/chronoval:${IMG_TAG}"
          echo "离线资源见仓库 Release 附件（版本下载）。"