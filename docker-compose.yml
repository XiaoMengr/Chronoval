name: chronoval

# Chronoval —— 个人摄影画廊
#
# 单服务全栈：Nuxt 4 前端 + Nitro 后端由同一容器托管。

# ▍数据目录（单目录持久化）
#   ./data -> /app/data：SQLite 数据库、上传照片/缩略图、配置均在此，备份/迁移只需复制 ./data。

# ▍媒体库目录（只读，自动扫描）
#   ./data/storage -> /app/storage:ro
#   - 图片目录：/app/storage/photos  => LIBRARY_PHOTOS_PATH
#   - 视频目录：/app/storage/videos  => LIBRARY_VIDEOS_PATH
#   把文件放进对应子目录即被自动扫描识别，原文件始终保留，只读挂载不会被改写。

# ▍本地扫描库（独立存储方式，给分散相册）
#   ./data/library -> /app/library（每个相册 = /app/library 下一个子目录，界面按容器内路径添加）。
#   缩略图就地生成到相册目录 thumbnails/，因此该外部库目录挂载为可写（rw）。

# 备注：通过「上传」进来的文件统一存入存储 prefix（默认 photos/）下一处，
#       应用不会自动按文件类型拆分到 photos/ 与 videos/ 两个子目录。

# 首次使用前先创建媒体库目录：
#     mkdir -p data/storage/photos data/storage/videos
# 快速开始：
#   1) mkdir -p data/storage/photos data/storage/videos
#   2) cp .env.example .env 并按需编辑（至少设置 NUXT_SESSION_PASSWORD）
#   3) 把照片放入 data/storage/photos，视频放入 data/storage/videos
#   4) docker compose up -d （默认拉取 GHCR 已构建镜像 ghcr.io/xiaomengr/chronoval:latest）
#      仅当你想从源码自己构建时才用：docker compose up -d --build
#   5) 打开 http://localhost:3000

services:
  chronoval:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/xiaomengr/chronoval:latest
    container_name: chronoval
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口，如需换端口改左侧即可
      - '3000:3000'
    env_file:
      # 从 .env 读取配置（管理员账号、会话密钥、站点信息等）。
      # 本地存储与媒体库的默认值已固化在镜像内（Dockerfile ENV），无需在此重复配置。
      - .env
    volumes:
      # 数据卷：数据库 + 上传照片/缩略图 + 配置（可写）
      - ./data:/app/data
      # 本地照片/视频目录（只读，需含 photos/ 与 videos/ 子目录）
      - ./data/storage:/app/storage:ro
      # 本地扫描库（独立相册，按容器内路径添加；缩略图就地生成，需可写）
      - ./data/library:/app/library
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s