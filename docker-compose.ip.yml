name: chronoval-ip

# ─────────────────────────────────────────────────────────────────────
# Chronoval —— 独立 IP 网络模式（macvlan）· 直接拉取内网镜像版
#
# 让 Chronoval 在局域网里拥有【自己独立的 IP】，不再占用宿主机端口，
# 直接通过 http://<独立IP>:3000 访问，行为如同局域网内的一台独立小主机。
#
# 本文件【不开本地编译】：
#   直接使用内网 Gitea Container 注册表里的现成镜像，改几个参数即可秒起。
#   镜像地址：172.16.0.1:322/xiaomengr/chronoval:<tag>
#     · latest   = 最新主分支构建（持续更新）
#     · 1.0.0.4  = 稳定版（对应 git tag v1.0.0.4）
#
# 本文件的 macvlan 网络是【内置】的（不再 external），因此网关、子网、
# IP 都可以在当前文件内直接自定义——无需再手动 docker network create。
#
# ── 需要改的四个地方（按你的局域网）──
#   ① driver_opts.parent    宿主机物理网卡名（ip addr 查看，如 eth0 / enp2s0 / br0）
#   ② ipam gateway          路由器/网关 IP（本例专用固定 172.16.0.254）
#   ③ ipam subnet           局域网网段（本网段为 172.16.0.0/24）
#   ④ services.ipv4_addre   容器固定 IP（改成局域网内一个【空闲】IP，本例 172.16.0.80）
#
# ▍0. 前置：让 Docker 能拉取内网镜像（只需一次）
#   内网镜像是 http 非 443，Docker 默认会拒绝 http 仓库，需先把
#   172.16.0.1:322 加入 insecure-registries（未配置则拉取报
#   "http: server gave HTTP response to HTTPS client"）。
#   编辑  /etc/docker/daemon.json ：
#       { "insecure-registries": ["172.16.0.1:322"] }
#   然后重启 docker：sudo systemctl restart docker
#
# ▍1. 登录内网仓库（只需一次；按需可选）
#   若该镜像非公开，用你的 Gitea 用户名 + 访问令牌登录：
#       docker login 172.16.0.1:322 --username <你的Gitea用户名>
#   （提示输入密码时，粘贴 Gitea 的 Access Token 或账号密码均可）
#
# ▍2. 直接使用（在本项目根目录执行，无需克隆源码仓库，无需建网络）
#   1) mkdir -p data/storage/photos data/storage/videos
#   2) cp .env.example .env   （按需编辑；管理员账号/站点信息可在网页首次引导里填）
#   3) 按上文①②③④ 改成你的局域网参数
#   4) docker compose -f docker-compose.ip.yml up -d        # ← 注意没有 --build
#   5) 浏览器打开 http://172.16.0.80:3000
#
#      · 想要稳定版：把 image 的 :latest 换成 :1.0.0.4
#      · 想要最新：保持 :latest 即可
#
# ▍升级/换版本 / 换 IP / 网关调整
#   改 image 的 tag、ipv4_address 或 ipam 参数后：
#       docker compose -f docker-compose.ip.yml up -d
#   （镜像会增量拉取新 tag，卷内数据保持不变；改 ipam 记得先 down 掉旧网络）
#
# ▍注意事项
#   · 本文件【没有 ports 端口映射】：macvlan 独立 IP 已直接监听 3000。
#   · macvlan 容器与宿主机之间的单向访问存在限制（容器默认较难主动访问宿主机）。
#     若你需要容器主动访问宿主上的其他服务（如反代到宿主机进程），
#     请改用「network_mode: host」模式，或另加一张宿主机回连接口。
#   · 一个物理网卡建议不要叠加太多 macvlan 地址段，避免互访异常。
# ─────────────────────────────────────────────────────────────────────

services:
  chronoval:
    # 直接使用内网 Gitea 注册表现成镜像（不本地编译）
    image: 172.16.0.1:322/xiaomengr/chronoval:latest
    container_name: chronoval-ip
    restart: unless-stopped
    networks:
      net_chronoval:
        ipv4_address: 172.16.0.80    # ④ ← 容器固定 IP（改成局域网内一个空闲 IP）
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./data/storage:/app/storage:ro
      - ./data/library:/app/library
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  # 内置 macvlan 网络：网关 / 子网 / IP 均在下方自定义，无需手动建网
  net_chronoval:
    name: chronoval-net
    driver: macvlan
    driver_opts:
      parent: eth0                 # ① ← 宿主机物理网卡名（ip addr 查看）
    ipam:
      config:
        - subnet: 172.16.0.0/24   # ③ ← 网段（与你要用的 IP 同一网段）
          gateway: 172.16.0.254   # ② ← 路由器/网关 IP