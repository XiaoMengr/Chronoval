name: chronoval

# ─────────────────────────────────────────────────────────────────────
# Chronoval —— 标准端口映射模式 · 直接拉取内网镜像版
#
# 让容器挂在默认 Docker 网络,通过宿主机端口对外访问，界面开放、链路简单，
# 是你这套 OVS 环境最可靠的部署方式（不依赖 macvlan 物理网卡）。
#
# 本文件【不开本地编译】，直接用内网 Gitea 注册表现成镜像：
#   镜像地址：ghcr.io/xiaomengr/chronoval:<tag>
#     · latest   = 最新主分支构建（持续更新）
#     · 1.0.0.4  = 稳定版（对应 git tag v1.0.0.4）
#
# 访问方式：
#   展示页面  http://<宿主机IP>:3000        （例如 http://172.16.0.1:3000）
#   如 3000 被占用，改下方 ports 左侧宿主机端口即可，例如 "3100:3000"
# ─────────────────────────────────────────────────────────────────────

services:
  chronoval:
    # 直接使用内网 Gitea 注册表现成镜像（不本地编译）
    image: ghcr.io/xiaomengr/chronoval:latest
    container_name: chronoval
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3000:3000'            # 宿主机3000 -> 容器3000（改左值即可换对外端口）
    volumes:
      - ./data:/app/data
      - ./data/storage:/app/storage:ro
      - ./data/library:/app/library
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s